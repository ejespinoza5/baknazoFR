<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAKNAZO — Letras salen de la bolsa</title>
<style>
  :root{--amarillo:#fdb305;--carbon:#242e3b;--bg:#FAFAF7;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;}
  .stage{width:min(70vw,460px)}
  svg{width:100%;height:auto;display:block;overflow:visible}

  /* La bolsa da un "salto" justo cuando expulsa las letras */
  #bolsa{fill:var(--amarillo);transform-origin:center;transform-box:fill-box;
    animation:saltoBolsa 3.4s ease-in-out infinite;}
  #halo{fill:var(--amarillo);transform-origin:center;transform-box:fill-box;opacity:0;
    animation:destello 3.4s ease-in-out infinite;}

  /* Cada letra parte desde el centro de la bolsa (arriba, diminuta) y viaja a su sitio */
  #letras path{
    fill:var(--carbon);
    transform-origin:1376px 700px;
    transform-box:view-box;
    opacity:0;
    animation:salir 3.4s cubic-bezier(.34,1.56,.64,1) infinite;
  }
  #letras path:nth-child(1){animation-delay:0.90s}
  #letras path:nth-child(2){animation-delay:1.03s}
  #letras path:nth-child(3){animation-delay:1.16s}
  #letras path:nth-child(4){animation-delay:1.29s}
  #letras path:nth-child(5){animation-delay:1.42s}
  #letras path:nth-child(6){animation-delay:1.55s}
  #letras path:nth-child(7){animation-delay:1.68s}

  @keyframes saltoBolsa{
    0%,18%{transform:scale(1)}
    26%{transform:scale(1.12) translateY(-6px)}
    34%{transform:scale(1)}
    100%{transform:scale(1)}
  }
  @keyframes destello{
    0%,20%,45%,100%{opacity:0}
    28%{opacity:.5;transform:scale(1.2)}
  }
  @keyframes salir{
    /* Nace dentro de la bolsa: pequeña, subida y transparente */
    0%,22%{opacity:0;transform:translate(0,-120px) scale(.05)}
    30%{opacity:1}
    /* Sale disparada y aterriza en su posición real (scale 1, sin desplazamiento) */
    55%{opacity:1;transform:translate(0,0) scale(1)}
    88%{opacity:1;transform:translate(0,0) scale(1)}
    100%{opacity:0;transform:translate(0,0) scale(1)}
  }
</style>
</head>
